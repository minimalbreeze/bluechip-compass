<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- 앱 이름은 여기(title / og / twitter), manifest.json, 그리고 화면 상단의
     .brand 블록 세 곳에만 있다. 이름을 바꿀 때는 이 셋만 고치면 된다. -->
<title>블루칩 나침반 – 50년 버틸 회사부터 시작하는 주식 가이드</title>
<meta name="description" content="향후 50년 망할 가능성이 낮은 블루칩만 골라, 오늘의 시장 국면에 맞춰 비중까지 계산해주는 초보자용 주식 가이드. 국내와 미장을 토글 하나로 오갑니다." />

<link rel="canonical" href="https://minimalbreeze.github.io/bluechip-compass/" />
<meta name="robots" content="index, follow" />

<meta name="theme-color" content="#1f5c50" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="블루칩 나침반" />
<meta name="mobile-web-app-capable" content="yes" />

<meta property="og:type" content="website" />
<meta property="og:title" content="블루칩 나침반 🧭 – 50년 버틸 회사부터" />
<meta property="og:description" content="안 망할 회사 26개를 6가지 축으로 채점하고, 오늘의 시장 국면에 맞춰 내 비중까지 계산해줍니다. 국내·미장 전환 가능." />
<meta property="og:url" content="https://minimalbreeze.github.io/bluechip-compass/" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="블루칩 나침반 🧭 – 50년 버틸 회사부터" />
<meta name="twitter:description" content="안 망할 회사 26개를 6가지 축으로 채점하고, 오늘의 시장 국면에 맞춰 내 비중까지 계산해줍니다." />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div id="app">

  <!-- ── 상단: 브랜드 + 시장 전환 ───────────────────────────────
       시장 전환은 이 앱에서 가장 자주 눌리는 조작이라 항상 화면에 붙어 있게
       한다. 탭을 옮겨도, 스크롤해도 사라지지 않는다. -->
  <header class="top">
    <div class="brand">
      <span class="brand-mark">🧭</span>
      <div>
        <h1>블루칩 나침반</h1>
        <p class="brand-sub">50년 뒤에도 있을 회사부터 시작합니다</p>
      </div>
    </div>

    <div class="market-switch" role="tablist" aria-label="시장 선택">
      <button class="ms-btn is-on" data-market="kr" role="tab" aria-selected="true">
        <span class="ms-flag">🇰🇷</span><span class="ms-label">국내</span>
      </button>
      <button class="ms-btn" data-market="us" role="tab" aria-selected="false">
        <span class="ms-flag">🇺🇸</span><span class="ms-label">미장</span>
      </button>
      <span class="ms-thumb" aria-hidden="true"></span>
    </div>
  </header>

  <!-- 첫 방문에만 뜨는 고지. 닫아도 '배우기' 탭 하단에 항상 남아 있다. -->
  <div id="disclaimer" class="disclaimer" hidden>
    <p><b>먼저 읽어주세요.</b> 이 앱은 <b>투자 교육 자료</b>입니다. 특정 종목의 매수·매도를 권유하지 않고, 어떤 수익도 보장하지 않습니다. 점수는 공개된 사업 구조를 바탕으로 한 <b>정성 평가</b>이며 가격·실적 데이터가 아닙니다. 투자 판단과 그 결과는 전적으로 본인의 몫입니다.</p>
    <button id="disclaimer-ok" class="disclaimer-ok" type="button">이해했습니다</button>
  </div>

  <main id="main">
    <section id="view-diagnose" class="view is-on"></section>
    <section id="view-picks"    class="view"></section>
    <section id="view-plan"     class="view"></section>
    <section id="view-learn"    class="view"></section>
  </main>

  <!-- ── 하단 탭 ────────────────────────────────────────────────
       순서 = 초보자가 밟아야 할 순서다. 종목 고르기(2번)보다
       나와 시장을 아는 것(1번)이 앞에 온다. -->
  <nav class="tabbar" role="tablist" aria-label="화면 전환">
    <button class="tab is-on" data-view="diagnose" role="tab" aria-selected="true">
      <span class="tab-ico">🧭</span><span class="tab-txt">진단</span>
    </button>
    <button class="tab" data-view="picks" role="tab" aria-selected="false">
      <span class="tab-ico">🏛️</span><span class="tab-txt">종목</span>
    </button>
    <button class="tab" data-view="plan" role="tab" aria-selected="false">
      <span class="tab-ico">🥧</span><span class="tab-txt">내 배분</span>
    </button>
    <button class="tab" data-view="learn" role="tab" aria-selected="false">
      <span class="tab-ico">📚</span><span class="tab-txt">배우기</span>
    </button>
  </nav>

</div>

<!-- 용어 설명 시트: 본문의 점선 밑줄을 누르면 아래에서 올라온다.
     초보자가 모르는 단어에서 멈추고 나가버리는 걸 막는 장치. -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-close="1"></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title"></h3>
    <p id="sheet-text"></p>
    <button class="sheet-close" data-close="1" type="button">닫기</button>
  </div>
</div>

<script src="data.js"></script>
<script src="market.js"></script>
<script src="app.js"></script>
</body>
</html>
