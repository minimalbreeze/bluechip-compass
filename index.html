<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<!-- 앱 이름은 여기(title / apple-mobile-web-app-title), manifest.json,
     그리고 아래 .gate-name / .brand 세 곳에만 있다. -->
<title>블루칩 나침반</title>
<meta name="description" content="시드를 넣으면 공격적·안정적·방어적 세 가지로 나눠 담을 종목과 금액을 알려주는 초보자용 주식 가이드." />

<!-- 지인끼리만 쓰는 앱이라 검색에 걸리지 않게 한다.
     robots.txt의 Disallow와 짝이다. 둘 다 있어야 한다 —
     robots.txt는 크롤링을, 이 태그는 색인을 막는다. -->
<meta name="robots" content="noindex, nofollow" />

<meta name="theme-color" content="#0e6ba8" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="블루칩 나침반" />
<meta name="mobile-web-app-capable" content="yes" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body>

<!-- ── 접근 코드 화면 ────────────────────────────────────────────
     보안이 아니라 문패다(config.js 설명 참고). 통과하면 이 브라우저에
     기억해서 다음부터 묻지 않는다.
     고지를 여기에 둔다 — 들어오는 모든 사람이 한 번은 읽고 지나간다. -->
<div id="gate" class="gate" hidden>
  <div class="gate-card">
    <span class="gate-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <defs><linearGradient id="gt-g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9ad8fb"/><stop offset="1" stop-color="#2f86c9"/>
        </linearGradient></defs>
        <rect width="64" height="64" fill="url(#gt-g)"/>
        <circle cx="32" cy="32" r="19.5" fill="#ffffff" opacity=".18"/>
        <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="3"/>
        <path d="M32 13 L37.4 32 L26.6 32 Z" fill="#e5342b"/>
        <path d="M32 51 L26.6 32 L37.4 32 Z" fill="#ffffff"/>
        <circle cx="32" cy="32" r="3.4" fill="#13334f"/>
      </svg>
    </span>
    <h1 class="gate-name">블루칩 나침반</h1>
    <p class="gate-sub">50년 뒤에도 있을 회사부터 시작합니다</p>

    <div class="gate-form">
      <input id="gate-input" type="password" inputmode="text" autocomplete="off"
             placeholder="접근 코드" aria-label="접근 코드" />
      <button id="gate-go" type="button">들어가기</button>
    </div>
    <p id="gate-hint" class="gate-hint"></p>
    <p id="gate-err" class="gate-err" hidden>코드가 맞지 않습니다.</p>

    <p class="gate-notice"><b>이 앱은 투자 교육 자료입니다.</b> 특정 종목의 매수·매도를 권유하지 않고 어떤 수익도 보장하지 않습니다. 보여주는 배분은 정해진 규칙으로 계산된 <b>예시</b>이며, 종목 점수는 공개된 사업 구조를 바탕으로 한 <b>정성 평가</b>입니다. 투자 판단과 그 결과는 전적으로 본인의 몫입니다.</p>
    <p class="gate-priv">입력한 값은 <b>이 브라우저에만</b> 저장되고 서버로 전송되지 않습니다.</p>
  </div>
</div>

<div id="app" hidden>

  <!-- ── 상단: 브랜드 + 시장 전환 ───────────────────────────────
       시장 전환은 가장 자주 눌리는 조작이라 항상 화면에 붙어 있게 한다. -->
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <defs><linearGradient id="bm-g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#9ad8fb"/><stop offset="1" stop-color="#2f86c9"/>
          </linearGradient></defs>
          <rect width="64" height="64" fill="url(#bm-g)"/>
          <circle cx="32" cy="32" r="19.5" fill="#ffffff" opacity=".18"/>
          <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="3"/>
          <path d="M32 13 L37.4 32 L26.6 32 Z" fill="#e5342b"/>
          <path d="M32 51 L26.6 32 L37.4 32 Z" fill="#ffffff"/>
          <circle cx="32" cy="32" r="3.4" fill="#13334f"/>
        </svg>
      </span>
      <div>
        <h1>블루칩 나침반</h1>
        <p class="brand-sub">50년 뒤에도 있을 회사부터</p>
      </div>
    </div>

    <div class="market-switch" role="tablist" aria-label="시장 선택">
      <button class="ms-btn is-on" data-market="kr" role="tab" aria-selected="true">
        <span class="ms-flag">🇰🇷</span><span class="ms-label">국내</span>
      </button>
      <button class="ms-btn" data-market="us" role="tab" aria-selected="false">
        <span class="ms-flag">🇺🇸</span><span class="ms-label">미국</span>
      </button>
      <span class="ms-thumb" aria-hidden="true"></span>
    </div>
  </header>

  <main id="main">
    <section id="view-home"   class="view is-on"></section>
    <section id="view-my"     class="view"></section>
    <section id="view-plan"   class="view"></section>
    <section id="view-stock"  class="view"></section>
    <section id="view-market" class="view"></section>
    <section id="view-learn"  class="view"></section>
  </main>

  <!-- ── 하단 탭 ────────────────────────────────────────────────
       홈이 첫 자리다: "지금 시장이 어떤가 + 내 돈이 지금 어떤가".
       그 다음이 내 주식(팔까/둘까/더 살까), 그 다음이 제안(새로 넣을 돈).
       공부(자료)는 맨 뒤에 둔다. -->
  <nav class="tabbar" role="tablist" aria-label="화면 전환">
    <button class="tab is-on" data-view="home" role="tab" aria-selected="true">
      <span class="tab-ico">🏠</span><span class="tab-txt">홈</span>
    </button>
    <button class="tab" data-view="my" role="tab" aria-selected="false">
      <span class="tab-ico">💼</span><span class="tab-txt">내 주식</span>
    </button>
    <button class="tab" data-view="plan" role="tab" aria-selected="false">
      <span class="tab-ico">🎯</span><span class="tab-txt">제안</span>
    </button>
    <button class="tab" data-view="stock" role="tab" aria-selected="false">
      <span class="tab-ico">🔎</span><span class="tab-txt">알아보기</span>
    </button>
    <button class="tab" data-view="market" role="tab" aria-selected="false">
      <span class="tab-ico">🎛️</span><span class="tab-txt">시장</span>
    </button>
    <button class="tab" data-view="learn" role="tab" aria-selected="false">
      <span class="tab-ico">📚</span><span class="tab-txt">자료</span>
    </button>
  </nav>
</div>

<!-- 용어 설명 시트: 점선 밑줄을 누르면 아래에서 올라온다. -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-close="1"></div>
  <div class="sheet-body" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title"></h3>
    <p id="sheet-text"></p>
    <button class="sheet-close" data-close="1" type="button">닫기</button>
  </div>
</div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="market.js"></script>
<script src="portfolios.js"></script>
<script src="holdings.js"></script>
<script src="sim.js"></script>
<script src="app.js"></script>
</body>
</html>
