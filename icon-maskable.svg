<!-- Android adaptive icon용. 런처가 바깥쪽을 원/스퀘어클로 깎아내므로
     나침반을 안전 영역(가운데 80%) 안으로 줄여 넣는다. 배경은 꽉 채운다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9ad8fb"/><stop offset="1" stop-color="#2f86c9"/>
  </linearGradient></defs>
  <rect width="64" height="64" fill="url(#g)"/>
  <g transform="translate(32 32) scale(0.72) translate(-32 -32)">
    <circle cx="32" cy="32" r="19.5" fill="#ffffff" opacity=".18"/>
    <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M32 13 L37.4 32 L26.6 32 Z" fill="#e5342b"/>
    <path d="M32 51 L26.6 32 L37.4 32 Z" fill="#ffffff"/>
    <circle cx="32" cy="32" r="3.4" fill="#13334f"/>
  </g>
</svg>
