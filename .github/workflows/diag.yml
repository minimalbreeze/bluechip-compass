# 진단 전용. 예약 없이 손으로만 돌린다.

name: diagnose

on:
  workflow_dispatch:
    inputs:
      selftest:
        description: '자기 자신을 다시 부를 수 있는지 시험 (GITHUB_TOKEN 으로)'
        type: boolean
        default: false
      echo:
        description: '(내부용) 자기호출로 들어왔음을 표시'
        required: false
        default: ''

permissions:
  contents: read
  actions: write        # 자기 자신을 dispatch 하려면 필요하다

jobs:
  cors:
    if: ${{ github.event.inputs.selftest != 'true' && github.event.inputs.echo == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/check-cors.mjs

  # ── 핵심 시험 ────────────────────────────────────────────────
  # GitHub 크론이 안 잡히는 게 확인됐다. 그렇다면 워크플로가 **자기 자신을
  # 다시 부르는** 방법으로 주기를 만들 수 있는지가 관건이다.
  #
  # GITHUB_TOKEN 으로 만든 이벤트는 보통 새 워크플로를 안 띄우는데,
  # workflow_dispatch 와 repository_dispatch 는 예외라고 문서에 적혀 있다.
  # 문서를 믿고 짜기 전에 실제로 되는지부터 본다.
  selftest:
    if: ${{ github.event.inputs.selftest == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 나를 다시 부른다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "지금 실행: $GITHUB_RUN_ID"
          echo "자기 자신을 echo=self 로 다시 부릅니다…"
          curl -sS -X POST -w '\n→ HTTP %{http_code}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/diag.yml/dispatches" \
            -d '{"ref":"main","inputs":{"echo":"self"}}'
          echo "204 면 요청은 받아들여진 것. 실제로 새 실행이 떴는지는 목록에서 확인한다."

  echoed:
    if: ${{ github.event.inputs.echo == 'self' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "✅✅✅ 자기호출로 실행됐습니다."
          echo "GITHUB_TOKEN 만으로 주기를 만들 수 있다는 뜻입니다 — 크론이 필요 없습니다."
