# 보유 종목 시세를 넓게 받아 prices.json 에 커밋한다.
#
# live.yml 과 나눈 이유는 scripts/fetch-prices.mjs 상단 주석 참고.
# 요약하면 (1) 앱을 열 때마다 받는 파일을 무겁게 하지 않기 위해,
# (2) 자기 보유 종목은 하루 두 번이면 충분하기 때문이다.

name: holding prices

on:
  schedule:
    # 국내장 마감 뒤(07:00 UTC = 16:00 KST)와 미국장 마감 뒤(21:30 UTC)
    - cron: '5 7 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: holding-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 목록에 오타가 있으면 매번 헛되이 두드리게 된다. 받아오기 전에 막는다.
      - name: 종목 목록 검증
        run: node scripts/check-list.mjs

      - name: 시세 받아오기
        run: node scripts/fetch-prices.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          # git diff 는 **추적 안 되는 파일을 못 본다.** 파일이 처음 생기는
          # 회차에는 다 만들어 놓고도 "변화 없음"으로 넘어가 버린다.
          # 실제로 prices.json 첫 생성 때 그렇게 날아갔다. add 부터 하고 staged 를 본다.
          git add prices.json
          if git diff --cached --quiet -- prices.json; then
            echo "변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 보유 종목 시세 갱신 [skip ci]"
          # 워크플로가 다섯 개고 전부 main 에 커밋한다. 두 개가 같은 분에
          # 끝나면 뒤에 온 쪽의 push 가 non-fast-forward 로 거절되고, 방금
          # 받아온 값이 통째로 버려진다(실제로 8/25 07:03 회차가 그렇게
          # 날아갔다). 거절되면 rebase 하고 다시 민다.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 거절 — 다시 받아 얹습니다 ($i/5)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          git push
