# 상장 종목 이름 색인을 하루 한 번 갱신한다.
#
# 왜 시세와 분리했나: 상장 목록은 하루에 몇 종목씩만 바뀐다. 시세 워크플로에
# 얹어 30분마다 KRX를 두드렸더니 몇 분 만에 HTTP 403 으로 막혔다. 필요 이상으로
# 남의 서버를 두드리지 않는 게 맞고, 그래야 우리 쪽도 안 막힌다.
#
# 실패해도 tickers.json 은 그대로 둔다(스크립트가 그렇게 동작한다).
# 자동완성이 하루 낡는 것보다 목록이 비어 버리는 쪽이 나쁘다.

name: ticker index

on:
  schedule:
    - cron: '40 20 * * *'     # 매일 UTC 20:40 (한국 05:40) — 장 시작 전
  workflow_dispatch:

concurrency:
  group: ticker-index
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 종목 목록 받아오기
        run: node scripts/build-tickers.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          # git diff 는 **추적 안 되는 파일을 못 본다.** 파일이 처음 생기는
          # 회차에는 다 만들어 놓고도 "변화 없음"으로 넘어가 버린다.
          # 실제로 tickers.json 첫 생성 때 그렇게 날아갔다. add 부터 하고 staged 를 본다.
          git add tickers.json
          if git diff --cached --quiet -- tickers.json; then
            echo "변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 종목 이름 색인 갱신 [skip ci]"
          # 워크플로가 다섯 개고 전부 main 에 커밋한다. 두 개가 같은 분에
          # 끝나면 뒤에 온 쪽의 push 가 non-fast-forward 로 거절되고, 방금
          # 받아온 값이 통째로 버려진다(실제로 8/25 07:03 회차가 그렇게
          # 날아갔다). 거절되면 rebase 하고 다시 민다.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 거절 — 다시 받아 얹습니다 ($i/5)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          git push
