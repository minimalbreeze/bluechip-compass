# 바뀐 게 있으면 카카오톡으로 알린다.
#
# 왜 서버에서 도는가
#   브라우저의 모의투자는 앱을 열 때만 하루치를 돌린다. 즉 앱을 안 열면 매매
#   자체가 일어나지 않아 알릴 것도 없다. 알림을 주려면 계좌를 굴리는 쪽이
#   서버여야 한다. 여기서 굴리는 건 "앱이 굴리는 기준 계좌"(sim-run.json)이고,
#   회원님 개인 보유·개인 모의계좌는 여전히 기기 밖으로 나가지 않는다.
#
# 시크릿이 없으면 전송만 건너뛰고 내용은 로그에 남긴다 — 설정 전에도
# "무엇이 올지" 확인할 수 있다.

name: kakao notify

on:
  schedule:
    # 하루 다섯 번 확인한다. 시세도 기사도 계속 움직이므로 하루 한 번으로는
    # 늦다. 대신 **보내는 건 중요도로 거르고 하루 상한(NOTIFY_CAP)을 둔다** —
    # 다섯 번 확인해도 보내는 날은 드물어야 정상이다.
    # 직장인이 볼 수 있는 시간에 맞췄다(KST = UTC+9).
    - cron: '30 22 * * 0-4'   # 07:30 KST 출근 전 (미국장 마감 반영)
    - cron: '30 3 * * 1-5'    # 12:30 KST 점심
    - cron: '0 7 * * 1-5'     # 16:00 KST 국내장 마감 뒤
    - cron: '0 11 * * 1-5'    # 20:00 KST 저녁
    - cron: '30 13 * * 1-5'   # 22:30 KST 미국장 개장
  workflow_dispatch:
    inputs:
      test:
        description: '연결 시험 — 바뀐 게 없어도 견본 카드를 한 장 보냅니다'
        type: boolean
        default: false

concurrency:
  group: kakao-notify
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      KAKAO_REST_KEY:      ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      NOTIFY_TEST:         ${{ github.event.inputs.test }}
      # 하루에 보낼 수 있는 카드 수. 넘치면 중요도가 낮은 것부터 미룬다.
      NOTIFY_CAP:          '5'
      # 카카오 콘솔에서 클라이언트 시크릿을 켠 경우에만 필요하다. 없으면 안 보낸다.
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 값은 절대 찍지 않는다. 있는지 없는지와 길이만 남긴다.
      - name: 시크릿 확인
        run: |
          if [ -n "$KAKAO_REST_KEY" ] && [ -n "$KAKAO_REFRESH_TOKEN" ]; then
            echo "💬 카카오 시크릿 있음 (키 ${#KAKAO_REST_KEY}자, 토큰 ${#KAKAO_REFRESH_TOKEN}자)"
          else
            echo "📭 카카오 시크릿 없음 — 보낼 내용만 로그에 남기고 전송은 건너뜁니다."
          fi

      - name: 바뀐 것 확인하고 알리기
        run: node scripts/notify.mjs

      - name: 기준 계좌 상태 커밋
        run: |
          git add sim-run.json
          if git diff --cached --quiet -- sim-run.json; then
            echo "변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 기준 계좌 갱신 [skip ci]"
          # 워크플로가 다섯 개고 전부 main 에 커밋한다. 두 개가 같은 분에
          # 끝나면 뒤에 온 쪽의 push 가 non-fast-forward 로 거절되고, 방금
          # 받아온 값이 통째로 버려진다(실제로 8/25 07:03 회차가 그렇게
          # 날아갔다). 거절되면 rebase 하고 다시 민다.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 거절 — 다시 받아 얹습니다 ($i/5)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          git push
