# 시세 스냅샷을 주기적으로 받아 live.json 에 커밋한다.
#
# 브라우저가 증권 API를 직접 못 부르는 이유(CORS)와 이 방식을 택한 이유는
# scripts/fetch-live.mjs 상단 주석 참고.
#
# ⚠️ GitHub 크론은 "정확히 그 시각"을 보장하지 않는다 — 혼잡하면 몇 분에서
#    십수 분까지 밀린다. 그래서 앱은 live.json 의 asOf 를 읽어 "몇 분 전 값"
#    인지 화면에 항상 표시한다. 실시간인 척하지 않는다.
#
# ⚠️ 공개 저장소라도 60일간 커밋이 없으면 GitHub이 예약 실행을 자동으로
#    비활성화한다. 이 워크플로가 매번 커밋하므로 보통 그 일은 없지만,
#    장기간 값이 안 바뀌면 Actions 탭에서 활성 상태를 확인할 것.

name: live market snapshot

on:
  schedule:
    # 한국장(00:00–07:00 UTC)과 미국장(13:00–21:00 UTC) 중에는 30분마다
    - cron: '*/30 0-7,13-21 * * 1-5'
    # 그 외 시간에는 하루 한 번만 (주말 포함)
    - cron: '25 9 * * *'
  workflow_dispatch:        # Actions 탭에서 수동 실행

concurrency:
  group: live-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # 셋 다 선택 사항이다. 없으면 각각 조용히 대체 경로로 간다:
    #   ANTHROPIC_API_KEY 없음 → 규칙 기반 국면 판정
    #   DEEPL_API_KEY     없음 → MyMemory 무료 번역
    #   MYMEMORY_EMAIL    없음 → 익명 호출(하루 한도가 더 낮다)
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      MYMEMORY_EMAIL: ${{ secrets.MYMEMORY_EMAIL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 시크릿이 실제로 들어왔는지 로그에 한 줄로 남긴다.
      # 값은 절대 찍지 않는다 — 있고 없음과 길이만 본다.
      # (예전에 키를 넣었다고 생각했는데 다른 탭에 저장돼 있어서
      #  AI 단계가 조용히 skip 되는 일이 있었다. 그걸 눈에 보이게 하려는 것.)
      - name: 시크릿 확인
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "🤖 ANTHROPIC_API_KEY 있음 (길이 ${#ANTHROPIC_API_KEY}) — AI 판정으로 갑니다"
          else
            echo "📐 ANTHROPIC_API_KEY 없음 — 규칙 판정으로 갑니다"
            echo "   저장 위치를 확인하세요: Settings → Secrets and variables → Actions"
            echo "   → Repository secrets 탭 (Environment/Dependabot/Codespaces 탭이 아닙니다)"
          fi
          if [ -n "$DEEPL_API_KEY" ]; then
            echo "🌐 DEEPL_API_KEY 있음 — DeepL 번역"
          else
            echo "🌐 DEEPL_API_KEY 없음 — MyMemory 무료 번역"
          fi

      # 키가 있을 때만 설치한다 — 없는 날은 규칙 판정으로 가므로 받을 이유가 없다.
      - name: AI 판정용 패키지 설치
        if: env.ANTHROPIC_API_KEY != ''
        run: npm install --no-save --no-audit --no-fund @anthropic-ai/sdk zod

      - name: 시세 받아오기
        run: node scripts/fetch-live.mjs

      - name: 바뀐 게 있으면 커밋
        run: |
          # git diff 는 **추적 안 되는 파일을 못 본다.** 파일이 처음 생기는
          # 회차에는 다 만들어 놓고도 "변화 없음"으로 넘어가 버린다.
          # 실제로 live.json 첫 생성 때 그렇게 날아갔다. add 부터 하고 staged 를 본다.
          git add live.json
          if git diff --cached --quiet -- live.json; then
            echo "변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: 시세 스냅샷 갱신 [skip ci]"
          # 워크플로가 다섯 개고 전부 main 에 커밋한다. 두 개가 같은 분에
          # 끝나면 뒤에 온 쪽의 push 가 non-fast-forward 로 거절되고, 방금
          # 받아온 값이 통째로 버려진다(실제로 8/25 07:03 회차가 그렇게
          # 날아갔다). 거절되면 rebase 하고 다시 민다.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push 거절 — 다시 받아 얹습니다 ($i/5)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((i * 3))
          done
          git push
