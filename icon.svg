<!-- 블루칩 나침반 앱 아이콘.
     나침반 = "어디로 갈지 정해주는 게 아니라 방향을 읽게 해준다"는 이 앱의 태도.
     북쪽 바늘만 상승 빨강(#e5342b), 남쪽은 흰색 — 지켜야 할 방향 하나만 찍는다.
     아이콘을 바꿀 때는 icon.svg / icon-maskable.svg / icon-180 / icon-192 /
     icon-512 / icon-512-maskable 여섯 개를 모두 다시 만든다(README 참고). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#9ad8fb"/><stop offset="1" stop-color="#2f86c9"/>
  </linearGradient></defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <circle cx="32" cy="32" r="19.5" fill="#ffffff" opacity=".18"/>
  <circle cx="32" cy="32" r="19" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M32 13 L37.4 32 L26.6 32 Z" fill="#e5342b"/>
  <path d="M32 51 L26.6 32 L37.4 32 Z" fill="#ffffff"/>
  <circle cx="32" cy="32" r="3.4" fill="#13334f"/>
</svg>
